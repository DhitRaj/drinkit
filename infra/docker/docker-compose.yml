services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drinkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drinkit
      POSTGRES_PASSWORD: drinkit
      POSTGRES_DB: drinkit
    ports:
      - "5432:5432"
    volumes:
      - drinkit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drinkit -d drinkit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drinkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - drinkit_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  drinkit_pg_data:
  drinkit_redis_data:
